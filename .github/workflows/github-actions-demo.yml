name: Deploy to EC2

on:
  push:
    branches:
      - develop
      - uat
      - release
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'master' && 'production' || github.ref_name == 'release' && 'release' || github.ref_name == 'uat' && 'uat' || 'development' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Allow GitHub runner SSH access
        env:
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_SECURITY_GROUP_ID}" ]; then
            echo "EC2_SECURITY_GROUP_ID secret is required."
            exit 1
          fi

          DEPLOY_PORT="${EC2_PORT:-22}"
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          RUNNER_CIDR="${RUNNER_IP}/32"

          echo "RUNNER_CIDR=${RUNNER_CIDR}" >> "${GITHUB_ENV}"
          echo "Allowing temporary SSH access from ${RUNNER_CIDR}."

          set +e
          TEMP_SG_RULE_ID="$(aws ec2 authorize-security-group-ingress \
            --group-id "${EC2_SECURITY_GROUP_ID}" \
            --ip-permissions "IpProtocol=tcp,FromPort=${DEPLOY_PORT},ToPort=${DEPLOY_PORT},IpRanges=[{CidrIp=${RUNNER_CIDR},Description=github-actions-${GITHUB_RUN_ID}}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text 2>authorize-error.txt)"
          AUTHORIZE_STATUS=$?
          set -e

          if [ "${AUTHORIZE_STATUS}" -ne 0 ]; then
            if grep -q "InvalidPermission.Duplicate" authorize-error.txt; then
              echo "Temporary ingress rule already exists; continuing without owning cleanup for it."
            else
              cat authorize-error.txt >&2
              exit "${AUTHORIZE_STATUS}"
            fi
          elif [ -n "${TEMP_SG_RULE_ID}" ] && [ "${TEMP_SG_RULE_ID}" != "None" ]; then
            echo "TEMP_SG_RULE_ID=${TEMP_SG_RULE_ID}" >> "${GITHUB_ENV}"
          fi

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_HOST}" ] || [ -z "${EC2_SSH_KEY}" ]; then
            echo "EC2_HOST and EC2_SSH_KEY secrets are required."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${EC2_SSH_KEY}" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          ssh-keyscan -p "${EC2_PORT:-22}" "${EC2_HOST}" >> ~/.ssh/known_hosts

      - name: Deploy build files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
        run: |
          set -euo pipefail

          DEPLOY_PORT="${EC2_PORT:-22}"
          DEPLOY_USER="${EC2_USER:-ubuntu}"
          DEPLOY_PATH="${EC2_DEPLOY_PATH}"

          ssh -i ~/.ssh/ec2_deploy_key -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${EC2_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          rsync -az --delete -e "ssh -i ~/.ssh/ec2_deploy_key -p ${DEPLOY_PORT}" dist/ "${DEPLOY_USER}@${EC2_HOST}:${DEPLOY_PATH}/"

      - name: Revoke GitHub runner SSH access
        if: always()
        env:
          EC2_PORT: ${{ secrets.EC2_PORT }}
          EC2_SECURITY_GROUP_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail

          if [ -z "${EC2_SECURITY_GROUP_ID:-}" ] || [ -z "${TEMP_SG_RULE_ID:-}" ]; then
            echo "No temporary SSH ingress rule to revoke."
            exit 0
          fi

          echo "Revoking temporary SSH access rule ${TEMP_SG_RULE_ID}."

          aws ec2 revoke-security-group-ingress \
            --group-id "${EC2_SECURITY_GROUP_ID}" \
            --security-group-rule-ids "${TEMP_SG_RULE_ID}" \
          || echo "Temporary ingress rule was already removed."
