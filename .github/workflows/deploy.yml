name: Build and deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Discover runner IP
        id: runner
        run: echo "ip=$(curl -fsSL https://checkip.amazonaws.com | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Temporarily allow runner SSH access
        id: ingress
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SG_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          SSH_PORT: ${{ secrets.EC2_PORT }}
          RUNNER_IP: ${{ steps.runner.outputs.ip }}
        run: |
          rule_id=$(aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=$SSH_PORT,ToPort=$SSH_PORT,IpRanges=[{CidrIp=$RUNNER_IP/32,Description='GitHub Actions temporary SSH'}]" \
            --query 'SecurityGroupRules[0].SecurityGroupRuleId' \
            --output text)
          echo "rule_id=$rule_id" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$EC2_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy versioned release
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_PORT: ${{ secrets.EC2_PORT }}
          DEPLOY_PATH: /var/www/meninblue-security
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/$RELEASE_ID'"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -p $EC2_PORT" \
            dist/ "$EC2_USER@$EC2_HOST:$DEPLOY_PATH/releases/$RELEASE_ID/"
          ssh -i ~/.ssh/deploy_key -p "$EC2_PORT" "$EC2_USER@$EC2_HOST" \
            "cd '$DEPLOY_PATH' && ln -sfn 'releases/$RELEASE_ID' current && ls -dt releases/* | tail -n +6 | xargs -r rm -rf"

      - name: Revoke temporary SSH access
        if: always() && steps.ingress.outputs.rule_id != '' && steps.ingress.outputs.rule_id != 'None'
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SG_ID: ${{ secrets.EC2_SECURITY_GROUP_ID }}
          RULE_ID: ${{ steps.ingress.outputs.rule_id }}
        run: aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --security-group-rule-ids "$RULE_ID"
